# Template meson cross-file untuk Rizin Android arm64-v8a.
# Diproses oleh build-rizin-android.sh via sed:
#   s|TOOLCHAIN|<path NDK toolchain>|g
#   s|API|<minSdk API level>|g
# JANGAN edit file hasil generate (android-arm64.ini) di $HOME -- edit template ini.

[binaries]
c = 'TOOLCHAIN/bin/aarch64-linux-androidAPI-clang'
cpp = 'TOOLCHAIN/bin/aarch64-linux-androidAPI-clang++'
ar = 'TOOLCHAIN/bin/llvm-ar'
ranlib = 'TOOLCHAIN/bin/llvm-ranlib'
strip = 'TOOLCHAIN/bin/llvm-strip'
pkgconfig = 'TOOLCHAIN/bin/llvm-pkg-config'

[built-in options]
c_args = ['-fPIC', '-O2']
cpp_args = ['-fPIC', '-O2']

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'arm64-v8a'
endian = 'little'